# Publishes the package to npm with a provenance statement when a version tag
# (for example 0.2.0) is pushed. n8n requires provenance for verified nodes.
#
# npm authentication: Trusted Publishing (OIDC) with GitHub Actions, repository
# fxmacrodata/n8n-nodes-fxmacrodata, workflow publish.yml. Before the package
# exists on npm, a granular NPM_TOKEN repository secret is used instead; remove
# it once the Trusted Publisher is configured.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm run build && npm test

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
